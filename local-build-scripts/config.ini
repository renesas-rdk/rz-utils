#Build settings and parameters

# Support platforms
#PLATFORM=RZG2L-SBC
#PLATFORM=RZG2L-EVK
#PLATFORM=RZV2L-EVK
#PLATFORM=RZV2H-EVK
PLATFORM=RZ-CMN

# List of platforms for the common build (RZ-CMN)
COMMON_PLATFORMS=("RZG2L-SBC" "RZG2L-EVK" "RZV2L-EVK" "RZV2H-EVK" "RZV2H-RDK" "RS-G2L100" "IMDT-V2H-SBC")

# Everything below lives under one workspace root, WORKDIR -- switching
# build machines means editing this one absolute path instead of every
# *_DIR line below. An already-exported WORKDIR env var still overrides it
# without editing this file at all.
WORKDIR="${WORKDIR:-/workspace/workspace}"

# These are the (absolute) input path where the software are located.
KERNEL_DIR="${KERNEL_DIR:-$WORKDIR/linux-rz}"
KERNEL_MODULES_OUTPUT_DIR="${KERNEL_MODULES_OUTPUT_DIR:-$WORKDIR/kernel-modules}"
UBOOT_DIR="${UBOOT_DIR:-$WORKDIR/u-boot}"
ATF_DIR="${ATF_DIR:-$WORKDIR/rz-atf}"
FLASH_WRITER_DIR="${FLASH_WRITER_DIR:-$WORKDIR/flash-writer}"

# Used only to auto-clone the matching *_DIR above if it does not exist yet
# (see ensure_src_dir() in common.sh). An existing checkout at *_DIR is
# always left alone, whatever branch it happens to be on -- these are just
# defaults for a from-scratch setup, not something the build re-syncs to.
# KERNEL_BRANCH in particular is often overridden per task (e.g. switching
# between the std and RT porting branches) -- update it here to match
# whichever branch you actually want cloned.
#
# HTTPS by default so a fresh clone works without an SSH key already set up;
# switch to the git@github.com:... SSH form for push access during
# development.
KERNEL_REPO=git@github.com:renesas-rdk/linux-rz.git
KERNEL_BRANCH=styhead/rz-cmn
UBOOT_REPO=git@github.com:Renesas-SST/u-boot.git
UBOOT_BRANCH=styhead/rz-cmn
ATF_REPO=git@github.com:Renesas-SST/rz-atf.git
ATF_BRANCH=styhead/rz-cmn
FLASH_WRITER_REPO=git@github.com:Renesas-SST/flash-writer.git
FLASH_WRITER_BRANCH=styhead/rz-cmn

# Support ATF build mode
#ATF_MODE=DEBUG
ATF_MODE=RELEASE

# Used by build_firmware_pack.sh (BL2 boot-header + BL2/FIP srec packaging),
# ported from meta-renesas's bptool-native.bb + firmware-pack.bb recipes.
#
# bptool.c/its Makefile are byte-identical to the copy ATF_DIR ships at the
# same tools/renesas/rz_boot_param/ path, but that Makefile still `include`s
# make_helpers/build_env.mk, a file upstream TF-A removed (ATF_DIR's
# styhead/rz-cmn branch included) when it dropped Windows-native build
# support -- only Renesas's own tools/renesas/* Makefiles were never updated
# to match, so building bptool straight out of ATF_DIR fails. BPTOOL_DIR
# stays a separate checkout, pinned to a commit that predates that removal.
BPTOOL_DIR="${BPTOOL_DIR:-$WORKDIR/rzg_trusted-firmware-a}"
BPTOOL_REPO=https://github.com/renesas-rz/rzg_trusted-firmware-a.git
BPTOOL_SRCREV=2b0c18857eebc7a973f611500f6615e991e2625e

# BL2/FIP load addresses and boot-media list. Sourced from meta-rz-bsp's
# conf/machine/rzv2h-evk.conf -- there is no RZV2H-RDK machine.conf in the
# Yocto tree, but build_flash_writer.sh already treats RZV2H-RDK and
# RZV2H-EVK as the same Flash-Writer board (RZV2H_DEV), so the EVK addresses
# apply here too.
BL2_BASE_ADDR=0x08103000
BL2_ADJUST_VMA=0x08101E00
FIP_ADJUST_VMA=0x0
BL2_BOOT_TARGET="spi mmc esd"

FIRMWARE_PACK_OUTPUT_DIR="${FIRMWARE_PACK_OUTPUT_DIR:-$WORKDIR/firmware-pack}"
