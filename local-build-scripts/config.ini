#Build settings and parameters

# Support platforms
#PLATFORM=RZG2L-SBC
#PLATFORM=RZG2L-EVK
#PLATFORM=RZV2L-EVK
#PLATFORM=RZV2H-EVK
PLATFORM=RZ-CMN

# List of platforms for the common build (RZ-CMN)
COMMON_PLATFORMS=("RZG2L-SBC" "RZG2L-EVK" "RZV2L-EVK" "RZV2H-EVK" "RZV2H-RDK" "RS-G2L100" "IMDT-V2H-SBC")

# These are the (absolute) input path where the software are located.
KERNEL_DIR=~/workspace/linux-rz
KERNEL_MODULES_OUTPUT_DIR=~/workspace/kernel-modules
UBOOT_DIR=~/workspace/u-boot
ATF_DIR=~/workspace/rz-atf
FLASH_WRITER_DIR=~/workspace/flash-writer

# Used only to auto-clone the matching *_DIR above if it does not exist yet
# (see ensure_src_dir() in common.sh). An existing checkout at *_DIR is
# always left alone, whatever branch it happens to be on -- these are just
# defaults for a from-scratch setup, not something the build re-syncs to.
# KERNEL_BRANCH in particular is often overridden per task (e.g. switching
# between the std and RT porting branches) -- update it here to match
# whichever branch you actually want cloned.
KERNEL_REPO=git@github.com:renesas-rdk/linux-rz.git
KERNEL_BRANCH=styhead/rz-cmn
UBOOT_REPO=git@github.com:Renesas-SST/u-boot.git
UBOOT_BRANCH=styhead/rz-cmn
ATF_REPO=git@github.com:Renesas-SST/rz-atf.git
ATF_BRANCH=styhead/rz-cmn
FLASH_WRITER_REPO=git@github.com:Renesas-SST/flash-writer.git
FLASH_WRITER_BRANCH=styhead/rz-cmn

# Support ATF build mode
#ATF_MODE=DEBUG
ATF_MODE=RELEASE
