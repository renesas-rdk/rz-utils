# Build settings for the RZ/V2H RDK (ver1 and ver101), the only supported board

# Everything below lives under WORKDIR (default: workspace/ at the top of this repo,
# ignored by git)
WORKDIR="${WORKDIR:-$(dirname "$(dirname "$(realpath "${BASH_SOURCE[0]}")")")/workspace}"

# Git sources (kernel, TF-A/U-Boot, out-of-tree modules): 1 = shallow, only the commit
# that is built (kernel branch: --depth 1 --single-branch); 0 = full history (an
# existing shallow tree is unshallowed on its next use)
GIT_SHALLOW="${GIT_SHALLOW:-1}"

# IPL (BL2 + FIP with BL31/U-Boot) for the RZ/V2H RDK, built by ipl_build/build_ipl.sh.
# TF-A/U-Boot repos, revisions and patches are pinned in ipl_build/ (see ipl_build/README.md).
# Boards: ver1 (16GB) and/or ver101 (8GB)
IPL_BOARDS="${IPL_BOARDS:-ver101}"
IPL_WORK_DIR="${IPL_WORK_DIR:-$WORKDIR/ipl-work}"
IPL_OUT_DIR="${IPL_OUT_DIR:-$WORKDIR/ipl-out}"
# Multi-OS options file (MACHINE_FEATURES:append lines); default ipl_build/machine-features.conf
#IPL_FEATURES_FILE=
# Or the options themselves, overriding the file, e.g. "RZ_CM33_FIRMWARE_LOAD RZ_CA55_CPU_CLOCKUP"
#IPL_FEATURES=

# Kernel
KERNEL_DIR="${KERNEL_DIR:-$WORKDIR/linux-rz}"
KERNEL_REPO=https://github.com/renesas-rdk/linux-rz.git
KERNEL_BRANCH=ubuntu/rz-v2h-rdk
# Optional: pin a commit (checked out with -f, local changes are lost). Unset: clone
# KERNEL_BRANCH once, then build the tree as it is (never pulls or resets).
#KERNEL_SRCREV=

# Optional: KERNEL_VARIANT=preempt-rt (fragment kernel-config/<name>.config merged on top of the board defconfig).
#KERNEL_VARIANT=

# Kernel modules: in-tree modules (kernel modules-install) and the out-of-tree
# kernel-modules/ scripts both install here
EXT_MODULES_SRC_DIR="${EXT_MODULES_SRC_DIR:-$WORKDIR/ext-modules}"
KERNEL_MODULES_OUTPUT_DIR="${KERNEL_MODULES_OUTPUT_DIR:-$WORKDIR/kernel-modules}"

# deploy: board rootfs layout (boot/, usr/lib/modules/) in $DEPLOY_DIR/rzv2h-rdk[-rt]
DEPLOY_DIR="${DEPLOY_DIR:-$WORKDIR/deploy}"
