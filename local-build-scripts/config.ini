#Build settings and parameters

# Support platforms
#PLATFORM=RZG2L-SBC
#PLATFORM=RZG2L-EVK
#PLATFORM=RZV2L-EVK
#PLATFORM=RZV2H-EVK
PLATFORM=RZ-CMN

# RZV2H-RDK
COMMON_PLATFORMS=("RZV2H-RDK")

# Everything below lives under WORKDIR
WORKDIR="${WORKDIR:-/workspace/workspace}"

# FLASH_WRITER
FLASH_WRITER_DIR="${FLASH_WRITER_DIR:-$WORKDIR/flash-writer}"
FLASH_WRITER_REPO=git@github.com:Renesas-SST/flash-writer.git
FLASH_WRITER_BRANCH=styhead/rz-cmn

# ATF
ATF_DIR="${ATF_DIR:-$WORKDIR/rzg_trusted-firmware-a}"
ATF_REPO=git@github.com:renesas-rz/rzg_trusted-firmware-a.git
ATF_SRCREV=bee53e1a5f2f009a1af320a871d8bac25ad09a5e
ATF_PATCH_DIR="${ATF_PATCH_DIR:-./ATF_patches}"
ATF_MODE=RELEASE
ATF_PLAT="v2h"
ATF_BOARD="evk_1"

# u-boot
UBOOT_DIR="${UBOOT_DIR:-$WORKDIR/u-boot}"
UBOOT_REPO=git@github.com:Renesas-SST/u-boot.git
UBOOT_BRANCH=styhead/rz-cmn

# Kernel
KERNEL_DIR="${KERNEL_DIR:-$WORKDIR/linux-rz}"
KERNEL_REPO=git@github.com:renesas-rdk/linux-rz.git
KERNEL_BRANCH=ubuntu/rz-v2h-rdk-rebase-6.18.20

# Optional kernel variant: a second kernel built from the same source tree
# with an extra Kconfig fragment merged on top of the board defconfig, so it
# can override anything the board configuration set. Left commented out so
# it can be set per run:
#
#   KERNEL_VARIANT=preempt-rt ./build_kernel.sh all
#
# The fragment is kernel-config/<name>.config. Shipped variants:
#
#   preempt-rt   CONFIG_PREEMPT_RT=y, release <version>-arm64-renesas-rt
#
# A variant fragment that sets CONFIG_LOCALVERSION gives the variant its own
# "uname -r" and its own /usr/lib/modules/<release>, so both kernels' modules
# can sit side by side. Build a variant into its own KERNEL_MODULES_OUTPUT_DIR
# to keep its Image/modules apart from the stock build's.
#KERNEL_VARIANT=

# Kernel modules:
EXT_MODULES_SRC_DIR="${EXT_MODULES_SRC_DIR:-$WORKDIR/ext-modules}"
KERNEL_MODULES_OUTPUT_DIR="${KERNEL_MODULES_OUTPUT_DIR:-$WORKDIR/kernel-modules}"


# BPTOOL
BPTOOL_DIR="${BPTOOL_DIR:-$WORKDIR/rzg_trusted-firmware-a}"
BPTOOL_REPO=https://github.com/renesas-rz/rzg_trusted-firmware-a.git
BPTOOL_SRCREV="${ATF_SRCREV}"  # same checkout as ATF_DIR now (both point at $WORKDIR/rzg_trusted-firmware-a) -- must stay pinned to the same commit

# Firmware pack output directory
FIRMWARE_PACK_OUTPUT_DIR="${FIRMWARE_PACK_OUTPUT_DIR:-$WORKDIR/firmware-pack}"

# BL2/FIP load addresses 
BL2_BASE_ADDR=0x08103000
BL2_ADJUST_VMA=0x08101E00
FIP_ADJUST_VMA=0x0
BL2_BOOT_TARGET="spi mmc esd"

